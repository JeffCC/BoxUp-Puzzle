<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Up 箱中箱</title>
<meta data-i18n-doctitle="page_title_game">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Box Up <small data-i18n-text="brand_sub_game">箱中箱</small></h1>
  <div class="row">
    <button id="prevBtn" data-i18n-title="btn_prev_title">◀</button>
    <select id="levelSel" data-i18n-aria="lvl_sel_aria"></select>
    <button id="nextBtn" data-i18n-title="btn_next_title">▶</button>
  </div>
  <nav><a class="btn" href="editor.html" data-i18n-text="nav_editor">✎ 關卡編輯器</a></nav>
</header>

<main class="layout">
  <section class="stack">
    <div class="card board-wrap">
      <div class="status" id="status"></div>
      <svg class="board" id="board"></svg>
      <div class="row" style="justify-content:center">
        <button id="undoBtn" data-i18n-text="btn_undo">↶ 復原 (Z)</button>
        <button id="restartBtn" data-i18n-text="btn_restart">⟲ 重新開始 (R)</button>
        <button id="hintBtn" data-i18n-text="btn_hint">💡 提示一步 (H)</button>
        <button id="solutionBtn" data-i18n-text="btn_play_solution">▶ 播放最短解</button>
      </div>
      <div class="dpad" data-i18n-aria="dpad_aria">
        <button class="u" data-dir="0">↑</button>
        <button class="l" data-dir="3">←</button>
        <button class="d" data-dir="2">↓</button>
        <button class="r" data-dir="1">→</button>
      </div>
    </div>

    <div class="card rules">
      <details>
        <summary data-i18n-text="rules_summary">遊戲規則</summary>
        <ul>
          <li data-i18n="rule_1"></li>
          <li data-i18n="rule_2"></li>
          <li data-i18n="rule_3"></li>
          <li data-i18n="rule_4"></li>
          <li data-i18n="rule_5"></li>
        </ul>
        <p class="muted" data-i18n-text="rules_kbd"></p>
      </details>
    </div>
  </section>

  <aside class="stack">
    <div class="card">
      <div class="stats">
        <div><b id="stepCount">0</b><span data-i18n-text="stat_steps">步數</span></div>
        <div><b id="bestCount">–</b><span data-i18n-text="stat_best">個人最佳</span></div>
        <div><b id="parCount">…</b><span data-i18n-text="stat_par">最短解</span></div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0" data-i18n-text="movelog_h2">移動紀錄</h2>
        <button class="small" id="copyMovesBtn" data-i18n-text="btn_copy">複製</button>
      </div>
      <div class="movelog" id="moveLog" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2 data-i18n-text="save_h2">存檔</h2>
      <div class="row">
        <input type="text" id="saveName" data-i18n-placeholder="save_name_placeholder" style="flex:1">
        <button class="primary" id="saveBtn" data-i18n-text="btn_save">💾 存檔</button>
      </div>
      <div class="list" id="recordList" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px">
        <button class="small" id="exportBtn" data-i18n-text="btn_export_all">⤓ 匯出全部 (JSON)</button>
        <button class="small" id="importBtn" data-i18n-text="btn_import">⤒ 匯入</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n-text="autosave_h2">過關自動存解法</h2>
      <div class="muted" id="autoSaveInfo" data-i18n-text="autosave_checking">檢查中…</div>
      <div class="row" style="margin-top:8px">
        <label class="row" style="gap:4px"><input type="checkbox" id="autoSaveOn" checked> <span data-i18n-text="autosave_toggle">過關時自動存檔</span></label>
        <button class="small" id="pickDirBtn" hidden data-i18n-text="btn_pick_dir">📁 選擇 solution 資料夾</button>
      </div>
    </div>

    <p class="muted" data-i18n="footer_credit"></p>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="boxup-core.js"></script>
<script src="levels.js"></script>
<script>
(function () {
  'use strict';
  const B = BoxUp;
  const T = (k, v) => window.I18N.t(k, v);
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast(T('toast_storage_fail')); } },
  };
  const K_RECORDS = 'boxup.records', K_CUSTOM = 'boxup.customLevels', K_BEST = 'boxup.best', K_LAST = 'boxup.lastLevel';

  let levels = [];
  let cur = null;
  let L = null;
  let history = [];
  let moves = '';
  let board = null;
  let solved = false;
  let replayTimer = null;
  let parCache = {};

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function buildLevelList() {
    levels = BOXUP_LEVELS.map((l, i) => ({ id: 'b' + i, name: `${i + 1}. ${l.author} ${l.name}`, code: l.code, author: l.author }));
    store.get(K_CUSTOM, []).forEach((l, i) => levels.push({ id: 'c:' + l.code, name: `★ ${l.name}`, code: l.code, custom: true }));
    const params = new URLSearchParams(location.search);
    const testCode = params.get('code');
    if (testCode && !levels.some(l => l.code === testCode)) {
      levels.push({ id: 't:' + testCode, name: `🧪 ${params.get('name') || T('test_level_default_name')}`, code: testCode, custom: true });
    }
    const sel = $('levelSel');
    sel.innerHTML = '';
    const groups = {};
    const group = key => {
      if (!groups[key]) {
        groups[key] = document.createElement('optgroup');
        groups[key].label = key === '*' ? T('group_custom') : BOXUP_AUTHORS[key];
        sel.appendChild(groups[key]);
      }
      return groups[key];
    };
    levels.forEach((l, i) => {
      const o = document.createElement('option'); o.value = i; o.textContent = l.name;
      group(l.custom ? '*' : l.author).appendChild(o);
    });
  }

  function levelIndexByCode(code) { return levels.findIndex(l => l.code === code); }

  function loadLevel(idx, movesToApply) {
    stopReplay();
    idx = Math.max(0, Math.min(levels.length - 1, idx));
    cur = levels[idx];
    $('levelSel').value = idx;
    $('prevBtn').disabled = idx === 0;
    $('nextBtn').disabled = idx === levels.length - 1;
    try { L = B.parse(cur.code); }
    catch (e) { $('status').textContent = T('status_bad_format', { msg: e.message }); return; }
    board = B.createBoard($('board'), L, { onCell: clickCell });
    history = [B.initialState(L)];
    moves = '';
    solved = false;
    $('board').classList.add('no-anim');
    render();
    requestAnimationFrame(() => requestAnimationFrame(() => $('board').classList.remove('no-anim')));
    document.title = 'Box Up ' + levelLabel(cur);
    store.set(K_LAST, cur.code);
    if (movesToApply) applyMoves(movesToApply, false);
    updatePar();
  }

  function updatePar() {
    const code = cur.code;
    if (parCache[code] !== undefined) { $('parCount').textContent = parCache[code] ?? T('par_no_solution'); return; }
    $('parCount').textContent = '…';
    setTimeout(() => {
      const r = B.solve(B.parse(code));
      parCache[code] = r.path ? r.path.length : null;
      if (cur.code === code) $('parCount').textContent = parCache[code] ?? (r.aborted ? T('par_too_big') : T('par_no_solution'));
    }, 30);
  }

  function state() { return history[history.length - 1]; }

  function doMove(dir, fromReplay) {
    if (!fromReplay && replayTimer) return false;
    if (solved) return false;
    const S = B.move(L, state(), dir);
    if (!S) { if (!fromReplay) bump(); return false; }
    history.push(S);
    moves += B.LETTERS[dir];
    if (B.isSolved(L, S)) onSolved();
    render();
    return true;
  }

  function bump() {
    const svg = $('board');
    svg.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 160 });
  }

  function applyMoves(str, animate) {
    for (const c of str) {
      const d = B.LETTERS.indexOf(c);
      if (d < 0) continue;
      if (!doMove(d, true)) break;
    }
  }

  function undo() {
    if (replayTimer || history.length <= 1) return;
    history.pop(); moves = moves.slice(0, -1); solved = false; render();
  }

  function restart() { stopReplay(); history = [history[0]]; moves = ''; solved = false; render(); }

  function onSolved() {
    solved = true;
    const best = store.get(K_BEST, {});
    const n = moves.length;
    if (!best[cur.code] || n < best[cur.code]) { best[cur.code] = n; store.set(K_BEST, best); }
    if (!replayTimer) autoSaveSolution();
  }

  const K_AUTOSAVE = 'boxup.autoSave';
  let saveMode = 'download', dirHandle = null;

  function levelLabel(l) { return l.name.replace(/^(\d+\.|★|🧪|📁)\s*/u, ''); }

  function recordText(r) {
    const arrows = B.movesToArrows(r.moves);
    const lines = [];
    for (let i = 0; i < arrows.length; i += 10) lines.push(String(i + 1).padStart(4) + ': ' + arrows.slice(i, i + 10));
    return `${T('rec_txt_header')}\n${T('rec_txt_name')}: ${r.name}\n${T('rec_txt_level')}: ${r.levelName}\n${T('rec_txt_code')}: ${r.levelCode}\n${T('rec_txt_steps')}: ${r.steps}\n${T('rec_txt_status')}: ${r.solved ? T('rec_txt_solved') : T('rec_txt_unfinished')}\n${T('rec_txt_time')}: ${new Date(r.savedAt).toLocaleString()}\n\n${T('rec_txt_moves_urdl')}: ${r.moves}\n\n${T('rec_txt_moves_arrows')}:\n${lines.join('\n')}\n`;
  }

  const safeName = n => n.replace(/[\\/:*?"<>|]/g, '_');

  function idb(op, value) {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('boxup', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onerror = () => rej(rq.error);
      rq.onsuccess = () => {
        const tx = rq.result.transaction('kv', op === 'get' ? 'readonly' : 'readwrite');
        const st = tx.objectStore('kv');
        const r2 = op === 'get' ? st.get('solutionDir') : st.put(value, 'solutionDir');
        r2.onsuccess = () => res(r2.result); r2.onerror = () => rej(r2.error);
      };
    });
  }

  async function initAutoSave() {
    $('autoSaveOn').checked = store.get(K_AUTOSAVE, true);
    try {
      const r = await fetch('api/ping', { cache: 'no-store' });
      if (r.ok && (await r.json()).ok) { saveMode = 'server'; return showSaveInfo(); }
    } catch (e) { }
    if (window.showDirectoryPicker) {
      $('pickDirBtn').hidden = false;
      try { dirHandle = await idb('get'); } catch (e) { dirHandle = null; }
      if (dirHandle) saveMode = 'dir';
    }
    showSaveInfo();
  }

  function showSaveInfo() {
    const info = $('autoSaveInfo');
    info.removeAttribute('data-i18n-text');
    if (saveMode === 'server') info.textContent = T('autosave_server');
    else if (saveMode === 'dir') info.textContent = T('autosave_dir', { name: dirHandle.name });
    else info.textContent = window.showDirectoryPicker ? T('autosave_download_pick') : T('autosave_download_only');
  }

  async function autoSaveSolution() {
    if (!$('autoSaveOn').checked) return;
    const name = levelLabel(cur);
    const filename = safeName(`${name}_${moves.length}.txt`);
    const r = { name: T('rec_default_won_name', { level: name }), levelName: name, levelCode: cur.code, moves, steps: moves.length, solved: true, savedAt: new Date().toISOString() };
    const content = recordText(r);
    try {
      if (saveMode === 'server') {
        const res = await fetch('api/solution', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filename, content }) });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error);
        return toast(T('toast_sol_saved', { file: j.file }));
      }
      if (saveMode === 'dir') {
        let perm = await dirHandle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') perm = await dirHandle.requestPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          const fh = await dirHandle.getFileHandle(filename, { create: true });
          const w = await fh.createWritable(); await w.write(content); await w.close();
          return toast(T('toast_sol_saved_dir', { dir: dirHandle.name, filename }));
        }
      }
    } catch (e) { toast(T('toast_autosave_failed', { msg: e.message })); }
    download(filename, content);
  }

  async function pickDir() {
    try {
      dirHandle = await window.showDirectoryPicker({ id: 'boxup-solution', mode: 'readwrite' });
      await idb('put', dirHandle);
      saveMode = 'dir'; showSaveInfo(); toast(T('toast_dir_set', { name: dirHandle.name }));
    } catch (e) { }
  }

  function clickCell(x, y) {
    const S = state();
    const dx = x - S.px, dy = y - S.py;
    if (Math.abs(dx) + Math.abs(dy) !== 1) return;
    doMove(B.DIRS.findIndex(d => d[0] === dx && d[1] === dy));
  }

  function render() {
    board.update(state());
    $('stepCount').textContent = moves.length;
    const best = store.get(K_BEST, {})[cur.code];
    $('bestCount').textContent = best ?? '–';
    $('board').classList.toggle('solved', solved);
    const st = $('status');
    if (solved) {
      const par = parCache[cur.code];
      st.textContent = T('msg_solved', { n: moves.length }) + (par && moves.length === par ? T('msg_solved_optimal') : '');
      st.className = 'status win';
    } else if (replayTimer) { st.textContent = T('msg_playing'); st.className = 'status'; }
    else { st.textContent = levelLabel(cur); st.className = 'status'; }
    renderLog();
    $('undoBtn').disabled = history.length <= 1 || !!replayTimer;
  }

  function renderLog(highlight) {
    const log = $('moveLog');
    if (!moves.length) { log.innerHTML = `<span class="muted">${T('no_moves_yet')}</span>`; return; }
    let html = '';
    for (let i = 0; i < moves.length; i += 10) {
      const chunk = [...moves.slice(i, i + 10)].map((c, j) => {
        const a = B.ARROWS[B.LETTERS.indexOf(c)];
        return (i + j === highlight) ? `<span class="cur">${a}</span>` : a;
      }).join('');
      html += `<span class="grp"><span class="num">${i + 1}</span>${chunk}</span>`;
    }
    log.innerHTML = html;
    log.scrollTop = log.scrollHeight;
  }

  function hint() {
    if (solved || replayTimer) return;
    const r = B.solve(L, state());
    if (!r.path) { toast(r.aborted ? T('hint_too_many') : T('hint_no_solution_here')); return; }
    toast(T('hint_text', { arrow: B.ARROWS[r.path[0]], n: r.path.length }));
    doMove(r.path[0]);
  }

  function playMoves(str, label) {
    stopReplay();
    history = [history[0]]; moves = ''; solved = false;
    let i = 0;
    replayTimer = setInterval(() => {
      if (i >= str.length || solved) { stopReplay(); toast(T('replay_done', { label })); return; }
      doMove(B.LETTERS.indexOf(str[i++]), true);
    }, 220);
    $('solutionBtn').textContent = T('btn_stop_play');
    $('solutionBtn').removeAttribute('data-i18n-text');
    render();
  }

  function stopReplay() {
    if (!replayTimer) return;
    clearInterval(replayTimer); replayTimer = null;
    $('solutionBtn').textContent = T('btn_play_solution');
    $('solutionBtn').setAttribute('data-i18n-text', 'btn_play_solution');
    if (board) render();
  }

  function records() { return store.get(K_RECORDS, []); }

  function saveRecord() {
    if (!moves.length) { toast(T('toast_no_moves')); return; }
    const list = records();
    const name = $('saveName').value.trim() || T('record_default_name', { level: levelLabel(cur), n: moves.length });
    list.unshift({
      id: Date.now().toString(36), name, levelName: levelLabel(cur), levelCode: cur.code,
      moves, steps: moves.length, solved, savedAt: new Date().toISOString(),
    });
    store.set(K_RECORDS, list);
    $('saveName').value = '';
    renderRecords();
    toast(T('toast_saved'));
  }

  function renderRecords() {
    const list = records(), box = $('recordList');
    if (!list.length) { box.innerHTML = `<div class="empty">${T('no_saves')}</div>`; return; }
    box.innerHTML = '';
    list.forEach(r => {
      const d = document.createElement('div'); d.className = 'item';
      const when = new Date(r.savedAt).toLocaleString();
      const badge = r.solved ? `<span class="badge ok">${T('badge_solved')}</span>` : `<span class="badge">${T('badge_in_progress')}</span>`;
      const stepsLabel = T('stat_steps');
      d.innerHTML = `<div class="t"></div>
        <div class="muted"><span class="lv"></span> · ${r.steps} ${stepsLabel} ${badge}<br>${when}</div>
        <div class="muted mv" style="font-family:ui-monospace,Consolas,monospace;word-break:break-all"></div>
        <div class="row">
          <button class="small" data-act="load">${T('btn_load_continue')}</button>
          <button class="small" data-act="replay">${T('btn_replay')}</button>
          <button class="small" data-act="txt">${T('btn_dl_txt')}</button>
          <button class="small danger" data-act="del">${T('btn_delete')}</button>
        </div>`;
      d.querySelector('.t').textContent = r.name;
      d.querySelector('.lv').textContent = r.levelName;
      const arrows = B.movesToArrows(r.moves);
      d.querySelector('.mv').textContent = arrows.length > 60 ? arrows.slice(0, 60) + '…' : arrows;
      d.addEventListener('click', e => {
        const act = e.target.dataset && e.target.dataset.act;
        if (act) recordAction(act, r);
      });
      box.appendChild(d);
    });
  }

  function ensureLevel(r) {
    let idx = levelIndexByCode(r.levelCode);
    if (idx < 0) {
      levels.push({ id: 't:' + r.levelCode, name: `📁 ${r.levelName}`, code: r.levelCode, custom: true });
      buildSelOnly();
      idx = levels.length - 1;
    }
    return idx;
  }
  function buildSelOnly() {
    const sel = $('levelSel'); const o = document.createElement('option');
    o.value = levels.length - 1; o.textContent = levels[levels.length - 1].name; sel.appendChild(o);
  }

  function recordAction(act, r) {
    if (act === 'load') { loadLevel(ensureLevel(r), r.moves); toast(T('toast_loaded', { name: r.name })); }
    else if (act === 'replay') { loadLevel(ensureLevel(r)); playMoves(r.moves, r.name); }
    else if (act === 'txt') downloadText(r);
    else if (act === 'del') {
      if (!confirm(T('confirm_delete_save', { name: r.name }))) return;
      store.set(K_RECORDS, records().filter(x => x.id !== r.id)); renderRecords();
    }
  }

  function download(filename, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
    a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function downloadText(r) {
    download(safeName(`${r.levelName}_${r.steps}.txt`), recordText(r));
  }

  function exportAll() {
    const data = { app: 'BoxUp', version: 1, exportedAt: new Date().toISOString(), records: records(), customLevels: store.get(K_CUSTOM, []) };
    download(T('file_save_all'), JSON.stringify(data, null, 2), 'application/json');
  }

  function importFile(file) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        const incoming = Array.isArray(data) ? data : (data.records || []);
        const list = records(); const ids = new Set(list.map(r => r.id));
        let n = 0;
        incoming.forEach(r => { if (r && r.levelCode && typeof r.moves === 'string' && !ids.has(r.id)) { list.push(r); n++; } });
        store.set(K_RECORDS, list);
        let m = 0;
        if (Array.isArray(data.customLevels)) {
          const cl = store.get(K_CUSTOM, []); const codes = new Set(cl.map(c => c.code));
          data.customLevels.forEach(c => { if (c && c.code && !codes.has(c.code)) { cl.push(c); m++; } });
          store.set(K_CUSTOM, cl);
        }
        renderRecords();
        if (m) { const code = cur.code; buildLevelList(); $('levelSel').value = levelIndexByCode(code); }
        toast(m ? T('toast_imported_both', { n, m }) : T('toast_imported', { n }));
      } catch (e) { toast(T('toast_import_failed')); }
    };
    rd.readAsText(file);
  }

  const KEYMAP = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };
  document.addEventListener('keydown', e => {
    if (e.target.matches && e.target.matches('input, textarea, select')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key in KEYMAP) { e.preventDefault(); doMove(KEYMAP[e.key]); }
    else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { e.preventDefault(); undo(); }
    else if (e.key === 'r' || e.key === 'R') restart();
    else if (e.key === 'h' || e.key === 'H') hint();
  });
  document.querySelectorAll('.dpad button').forEach(b => b.addEventListener('click', () => doMove(+b.dataset.dir)));

  let touch = null;
  $('board').addEventListener('touchstart', e => { const t = e.touches[0]; touch = [t.clientX, t.clientY]; }, { passive: true });
  $('board').addEventListener('touchend', e => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch[0], dy = t.clientY - touch[1];
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    e.preventDefault();
    doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  });

  $('levelSel').addEventListener('change', e => loadLevel(+e.target.value));
  $('prevBtn').addEventListener('click', () => loadLevel(+$('levelSel').value - 1));
  $('nextBtn').addEventListener('click', () => loadLevel(+$('levelSel').value + 1));
  $('undoBtn').addEventListener('click', undo);
  $('restartBtn').addEventListener('click', restart);
  $('hintBtn').addEventListener('click', hint);
  $('solutionBtn').addEventListener('click', () => {
    if (replayTimer) { stopReplay(); return; }
    const r = B.solve(L);
    if (!r.path) { toast(T('level_no_solution')); return; }
    playMoves(r.path.map(d => B.LETTERS[d]).join(''), T('label_shortest'));
  });
  $('copyMovesBtn').addEventListener('click', () => {
    const text = B.movesToArrows(moves);
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => toast(T('toast_copied')), () => toast(T('toast_copy_failed')));
  });
  $('saveBtn').addEventListener('click', saveRecord);
  $('pickDirBtn').addEventListener('click', pickDir);
  $('autoSaveOn').addEventListener('change', e => store.set(K_AUTOSAVE, e.target.checked));
  $('saveName').addEventListener('keydown', e => { if (e.key === 'Enter') saveRecord(); });
  $('exportBtn').addEventListener('click', exportAll);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; });

  // 語言切換:整個清單與動態區塊都重畫
  window.onI18nChange = function () {
    buildLevelList();
    if (cur) {
      const idx = levelIndexByCode(cur.code);
      if (idx >= 0) $('levelSel').value = idx;
    }
    renderRecords();
    showSaveInfo();
    if (board) render(); else if (cur) $('status').textContent = levelLabel(cur);
    const code = cur && cur.code;
    if (code && parCache[code] === null) $('parCount').textContent = T('par_no_solution');
  };

  buildLevelList();
  const params = new URLSearchParams(location.search);
  let start = 0;
  if (params.get('code')) start = levelIndexByCode(params.get('code'));
  else { const last = store.get(K_LAST, null); const i = last ? levelIndexByCode(last) : -1; if (i >= 0) start = i; }
  loadLevel(start < 0 ? 0 : start);
  renderRecords();
  initAutoSave();
})();
</script>
</body>
</html>
